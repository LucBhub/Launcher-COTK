name: Release launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-launcher
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Lire la version du csproj
        id: ver
        shell: pwsh
        run: |
          $xml = [xml](Get-Content src/COTK.Launcher.csproj)
          $v = $xml.Project.PropertyGroup.Version
          "version=$v" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Version launcher : $v"

      - name: Publish self-contained win-x64
        run: dotnet publish src/COTK.Launcher.csproj -c Release -r win-x64 --self-contained true -o stage

      - name: Completer le dossier de publication (fonts, config, docs)
        shell: pwsh
        run: |
          Copy-Item fonts stage/fonts -Recurse
          Copy-Item JOUE.bat stage/
          Copy-Item ClientConfig.example.ini stage/
          Copy-Item README.md stage/

      - name: Zip pour l'auto-update des launchers existants
        shell: pwsh
        run: |
          Compress-Archive -Path stage/* `
            -DestinationPath "cotk-launcher-${{ steps.ver.outputs.version }}.zip"

      - name: Compiler l'assistant d'installation (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe introuvable apres installation.' }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\cotk.iss
          if ($LASTEXITCODE -ne 0) { throw "Compilation Inno Setup echouee." }
          Get-ChildItem installer\InstallerOut

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-release
          path: |
            cotk-launcher-*.zip
            installer/InstallerOut/cotk-launcher-setup-*.exe
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: launcher-release
          path: artifact/

      - name: Calculer versions et empreintes
        id: meta
        run: |
          ZIP=$(ls artifact/cotk-launcher-*.zip | head -1)
          EXE=$(ls artifact/installer/InstallerOut/cotk-launcher-setup-*.exe artifact/cotk-launcher-setup-*.exe 2>/dev/null | head -1)
          VER=${ZIP#artifact/cotk-launcher-}; VER=${VER%.zip}
          SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ZIP")
          echo "zip=$ZIP"   >> "$GITHUB_OUTPUT"
          echo "exe=$EXE"   >> "$GITHUB_OUTPUT"
          echo "ver=$VER"   >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"   >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "Launcher v$VER : zip=$SIZE octets, setup=$(basename "$EXE")"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Uploader vers dl.cotk.fr + mettre a jour le manifeste
        env:
          VER: ${{ steps.meta.outputs.ver }}
          SHA: ${{ steps.meta.outputs.sha }}
          SIZE: ${{ steps.meta.outputs.size }}
          ZIP: ${{ steps.meta.outputs.zip }}
          EXE: ${{ steps.meta.outputs.exe }}
        run: |
          scp "$ZIP" "$EXE" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/"

          SETUP_NAME=$(basename "$EXE")
          SETUP_URL="https://dl.cotk.fr/$SETUP_NAME"

          # Manifeste mis a jour localement puis pousse en un seul fichier :
          # evite tout quoting de script distant multi-lignes.
          curl -fsS https://dl.cotk.fr/manifest.json | jq \
            --arg ver "$VER" --arg sha "$SHA" --argjson size "$SIZE" '
            .launcher.version     = $ver
            | .launcher.downloadUrl = ("https://dl.cotk.fr/cotk-launcher-" + $ver + ".zip")
            | .launcher.setupUrl    = ("https://dl.cotk.fr/cotk-launcher-setup-" + $ver + ".exe")
            | .launcher.sha256      = $sha
            | .launcher.sizeBytes   = $size
            | .client.filesUrl      = "https://dl.cotk.fr/client-files.json"' > manifest.json

          scp manifest.json \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/manifest.json.new"

          ssh -o StrictHostKeyChecking=accept-new "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
             "sudo mv /tmp/\$(basename $ZIP) /opt/zemu/downloads/ && sudo mv /tmp/$SETUP_NAME /opt/zemu/downloads/ && sudo cp /opt/zemu/downloads/\$(basename $ZIP) /opt/zemu/downloads/cotk-launcher-latest.zip && sudo cp /opt/zemu/downloads/$SETUP_NAME /opt/zemu/downloads/cotk-launcher-setup-latest.exe && sudo mv /tmp/manifest.json.new /opt/zemu/downloads/manifest.json && sudo chmod 644 /opt/zemu/downloads/*"

          sleep 3
          LIVE=$(curl -fsS https://dl.cotk.fr/manifest.json | jq -r .launcher.sha256)
          [ "$LIVE" = "$SHA" ] || { echo "Manifeste non propage : $LIVE != $SHA"; exit 1; }
          # Verifier l'archive REELLEMENT servie, pas seulement le manifeste :
          # un mv rate laisse l'ancien ZIP en place avec un manifeste a jour,
          # et aucun launcher ne peut alors valider la mise a jour (SHA mismatch).
          SERVED_PATH=$(mktemp)
          curl -fsSL -o "$SERVED_PATH" "https://dl.cotk.fr/cotk-launcher-$VER.zip"
          SERVED_SHA=$(sha256sum "$SERVED_PATH" | cut -d' ' -f1)
          [ "$SERVED_SHA" = "$SHA" ] || { echo "ZIP servi corrompu/ancien : $SERVED_SHA != $SHA"; exit 1; }
          SERVED_SIZE=$(stat -c%s "$SERVED_PATH")
          [ "$SERVED_SIZE" = "$SIZE" ] || { echo "Taille servie $SERVED_SIZE != $SIZE"; exit 1; }
          echo "dl.cotk.fr a jour : launcher v$VER + setup (ZIP servi verifie : SHA + taille OK)."

      - name: Attacher les artefacts a un tag
        env:
          VER: ${{ steps.meta.outputs.ver }}
        run: |
          git tag "launcher-v$VER" --force || true
          git push origin "launcher-v$VER" --force || true
